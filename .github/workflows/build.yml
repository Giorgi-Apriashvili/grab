name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-release, clang-cl-release]
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches project(VERSION)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match project version v$version in CMakeLists.txt"
          }
          Write-Output "tag matches project version v$version"

      # Provides cl/link/rc for the msvc preset; harmless for clang-cl, which finds the
      # Visual Studio installation on its own.
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # The runner's Visual Studio STL can need a newer Clang than the runner's own LLVM (MSVC
      # 14.52 wants Clang 22; the image had LLVM 20.1.8 on 2026-11-21). The STL names the version it
      # needs; the newest clang-cl here that meets it goes on PATH (Visual Studio's own, or
      # C:\Program Files\LLVM), else the LLVM release grab is built with locally is installed.
      - name: Put a clang-cl that fits the STL on PATH
        if: matrix.preset == 'clang-cl-release'
        timeout-minutes: 15
        shell: pwsh
        env:
          LLVM_FALLBACK: 22.1.8
        run: |
          $need = 0
          $yvals = Join-Path $env:VCToolsInstallDir 'include\yvals_core.h'
          if ((Test-Path $yvals) -and ((Get-Content -Raw $yvals) -match 'expected Clang (\d+)')) { $need = [int]$Matches[1] }
          function Get-ClangVersion([string]$dir) {
            $exe = Join-Path $dir 'clang-cl.exe'
            if (-not (Test-Path $exe)) { return $null }
            foreach ($tool in 'lld-link.exe', 'llvm-rc.exe') { if (-not (Test-Path (Join-Path $dir $tool))) { return $null } }
            if ((& $exe --version | Select-Object -First 1) -match 'version (\d+\.\d+\.\d+)') { return [version]$Matches[1] }
            return $null
          }
          $found = @(Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'; 'C:\Program Files\LLVM\bin') |
            ForEach-Object { [pscustomobject]@{ Dir = $_; Version = (Get-ClangVersion $_) } } |
            Where-Object { $_.Version }
          $found | ForEach-Object { Write-Output "found clang-cl $($_.Version) in $($_.Dir)" }
          $best = $found | Where-Object { $_.Version.Major -ge $need } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $best) {
            Write-Output "no clang-cl here meets the STL's Clang ${need}: installing LLVM $env:LLVM_FALLBACK"
            $setup = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_FALLBACK-win64.exe"
            Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_FALLBACK/LLVM-$env:LLVM_FALLBACK-win64.exe" -OutFile $setup
            Start-Process -Wait -FilePath $setup -ArgumentList '/S', '/D=C:\llvm-ci'
            $best = [pscustomobject]@{ Dir = 'C:\llvm-ci\bin'; Version = (Get-ClangVersion 'C:\llvm-ci\bin') }
            if (-not $best.Version -or $best.Version.Major -lt $need) { throw "LLVM $env:LLVM_FALLBACK did not install a clang-cl that meets Clang $need" }
          }
          Write-Output "using clang-cl $($best.Version) from $($best.Dir) (the STL wants Clang $need or newer)"
          Add-Content -Path $env:GITHUB_PATH -Value $best.Dir

      # OpenSSL comes from vcpkg (cmake/vcpkg.cmake): the runner's own checkout, with vcpkg's
      # built packages kept between runs so OpenSSL is built only when its port changes.
      - name: vcpkg
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          $cache = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_DEFAULT_BINARY_CACHE=$cache"

      - name: vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure -LE page

      # The window's page logic (tests/page) in the runner's own Edge and PowerShell 7, about 10 s.
      # It builds nothing, so one job runs it, the shorter one; run directly rather than through
      # CTest, so a runner without Edge fails here (exit 77) instead of skipping it.
      - name: Page-logic tests
        if: matrix.preset == 'clang-cl-release'
        timeout-minutes: 10
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File tests/page/run_page_test.ps1

      # Inno Setup 6 is preinstalled on the Windows runner image, so dist yields both files.
      - name: Package (portable zip + Inno Setup installer)
        if: matrix.preset == 'msvc-release'
        run: cmake --build --preset msvc-release --target dist

      # `grab update` refuses any download that doesn't match this file.
      - name: Checksums
        if: matrix.preset == 'msvc-release'
        shell: pwsh
        working-directory: build/msvc-release/dist
        run: |
          Get-ChildItem -File | Where-Object { $_.Extension -in '.zip', '.exe' } | Sort-Object Name |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload artifacts
        if: matrix.preset == 'msvc-release'
        uses: actions/upload-artifact@v4
        with:
          name: grab-windows-x64
          path: |
            build/msvc-release/dist/*.zip
            build/msvc-release/dist/*.exe
            build/msvc-release/dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grab-windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
